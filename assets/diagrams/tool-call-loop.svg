<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">天气工具调用闭环</title>
  <desc id="desc">用户向宿主提问，宿主调用模型；模型返回工具调用请求，宿主验证并执行工具，再把工具结果发给模型，最终回答用户。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#312e81" flood-opacity="0.13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#818cf8"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14b8a6"/></marker>
  </defs>
  <rect width="1200" height="690" rx="28" fill="url(#bg)"/>
  <g font-family="Inter, 'Noto Sans SC', sans-serif">
    <text x="600" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#1e1b4b">“查询北京天气”如何经过一次完整工具闭环</text>
    <text x="600" y="76" text-anchor="middle" font-size="14" fill="#64748b">紫色是消息与请求；绿色是宿主控制的真实执行与结果</text>

    <g filter="url(#shadow)">
      <rect x="65" y="108" width="205" height="73" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="167" y="139" text-anchor="middle" font-size="19" font-weight="700" fill="#334155">用户</text>
      <text x="167" y="163" text-anchor="middle" font-size="13" fill="#64748b">提出目标，接收回答</text>

      <rect x="355" y="108" width="250" height="73" rx="18" fill="url(#primary)"/>
      <text x="480" y="139" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">宿主程序</text>
      <text x="480" y="163" text-anchor="middle" font-size="13" fill="#e0e7ff">上下文、循环、校验与权限</text>

      <rect x="690" y="108" width="205" height="73" rx="18" fill="#ffffff" stroke="#a5b4fc"/>
      <text x="792" y="139" text-anchor="middle" font-size="19" font-weight="700" fill="#312e81">模型</text>
      <text x="792" y="163" text-anchor="middle" font-size="13" fill="#64748b">生成回答或工具请求</text>

      <rect x="980" y="108" width="155" height="73" rx="18" fill="#ecfeff" stroke="#5eead4"/>
      <text x="1057" y="139" text-anchor="middle" font-size="19" font-weight="700" fill="#115e59">天气工具</text>
      <text x="1057" y="163" text-anchor="middle" font-size="13" fill="#0f766e">访问实时数据</text>
    </g>

    <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 7">
      <path d="M167 190V626"/><path d="M480 190V626"/><path d="M792 190V626"/><path d="M1057 190V626"/>
    </g>

    <g fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#arrow)">
      <path d="M167 227H470"/>
      <path d="M480 292H782"/>
      <path d="M792 357H490"/>
      <path d="M480 552H782"/>
      <path d="M792 612H490"/>
      <path d="M480 652H177"/>
    </g>
    <g fill="none" stroke="#14b8a6" stroke-width="3" marker-end="url(#greenArrow)">
      <path d="M490 454H1047"/>
      <path d="M1057 507H490"/>
    </g>

    <g font-size="14" fill="#334155">
      <rect x="232" y="207" width="180" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="322" y="229" text-anchor="middle">① “北京现在天气？”</text>

      <rect x="565" y="272" width="145" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="637" y="294" text-anchor="middle">② 消息 + 工具说明</text>

      <rect x="545" y="337" width="182" height="34" rx="17" fill="#eef2ff" stroke="#c7d2fe"/>
      <text x="636" y="359" text-anchor="middle" fill="#4338ca">③ get_weather 请求</text>

      <rect x="382" y="392" width="196" height="43" rx="12" fill="#fff7ed" stroke="#fdba74"/>
      <text x="480" y="410" text-anchor="middle" font-weight="700" fill="#9a3412">关键执行边界</text>
      <text x="480" y="427" text-anchor="middle" font-size="12" fill="#c2410c">验证工具、参数、权限与限制</text>

      <rect x="687" y="434" width="175" height="34" rx="17" fill="#ecfeff" stroke="#99f6e4"/>
      <text x="774" y="456" text-anchor="middle" fill="#0f766e">④ 宿主执行工具</text>

      <rect x="679" y="487" width="179" height="34" rx="17" fill="#ecfeff" stroke="#99f6e4"/>
      <text x="768" y="509" text-anchor="middle" fill="#0f766e">⑤ 返回 28°C、多云</text>

      <rect x="570" y="532" width="130" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="635" y="554" text-anchor="middle">⑥ Tool Result</text>

      <rect x="556" y="592" width="158" height="34" rx="17" fill="#eef2ff" stroke="#c7d2fe"/>
      <text x="635" y="614" text-anchor="middle" fill="#4338ca">⑦ 生成最终回答</text>

      <rect x="230" y="632" width="185" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="322" y="654" text-anchor="middle">⑧ 展示带时间的天气</text>
    </g>

    <rect x="70" y="275" width="260" height="284" rx="18" fill="#ffffff" fill-opacity="0.82" stroke="#e2e8f0"/>
    <text x="92" y="308" font-size="15" font-weight="700" fill="#334155">请注意两条边界</text>
    <circle cx="95" cy="348" r="13" fill="#4f46e5"/><text x="95" y="353" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">A</text>
    <text x="120" y="344" font-size="13" fill="#475569">模型只返回调用请求</text>
    <text x="120" y="365" font-size="13" fill="#64748b">并没有亲自访问天气服务</text>
    <circle cx="95" cy="409" r="13" fill="#14b8a6"/><text x="95" y="414" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">B</text>
    <text x="120" y="405" font-size="13" fill="#475569">宿主拥有执行权</text>
    <text x="120" y="426" font-size="13" fill="#64748b">并负责校验、拒绝与审计</text>
    <path d="M92 461H308" stroke="#e2e8f0"/>
    <text x="92" y="490" font-size="13" font-weight="700" fill="#334155">为什么还要再问模型？</text>
    <text x="92" y="514" font-size="13" fill="#64748b">让模型观察真实结果，结合原问题</text>
    <text x="92" y="535" font-size="13" fill="#64748b">决定回答、继续调用或停止。</text>
  </g>
</svg>
