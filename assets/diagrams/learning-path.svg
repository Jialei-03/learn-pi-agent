<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Learn Pi Agent 递进学习路径</title>
  <desc id="desc">从基础直觉，经由行业 API、论文背景、Pi 工程结构，最终走向源码运行追踪。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#312e81" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
    </marker>
  </defs>
  <rect width="1200" height="350" rx="28" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" font-family="Inter, 'Noto Sans SC', sans-serif" font-size="25" font-weight="700" fill="#1e1b4b">不要从热词跳进源码：沿一条可验证的路径前进</text>
  <text x="600" y="84" text-anchor="middle" font-family="Inter, 'Noto Sans SC', sans-serif" font-size="15" fill="#64748b">每一步都回答“为什么”，再进入“怎样实现”</text>
  <g stroke="#818cf8" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M 236 190 H 278"/>
    <path d="M 456 190 H 498"/>
    <path d="M 676 190 H 718"/>
    <path d="M 896 190 H 938"/>
  </g>
  <g filter="url(#shadow)" font-family="Inter, 'Noto Sans SC', sans-serif">
    <g transform="translate(58 120)">
      <rect width="178" height="142" rx="18" fill="#ffffff" stroke="#c7d2fe"/>
      <circle cx="89" cy="38" r="22" fill="url(#step)"/>
      <text x="89" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">1</text>
      <text x="89" y="84" text-anchor="middle" font-size="19" font-weight="700" fill="#312e81">基础直觉</text>
      <text x="89" y="111" text-anchor="middle" font-size="14" fill="#64748b">模型、消息、上下文</text>
    </g>
    <g transform="translate(278 120)">
      <rect width="178" height="142" rx="18" fill="#ffffff" stroke="#c7d2fe"/>
      <circle cx="89" cy="38" r="22" fill="url(#step)"/>
      <text x="89" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">2</text>
      <text x="89" y="84" text-anchor="middle" font-size="19" font-weight="700" fill="#312e81">行业 API</text>
      <text x="89" y="111" text-anchor="middle" font-size="14" fill="#64748b">内容块、流、工具调用</text>
    </g>
    <g transform="translate(498 120)">
      <rect width="178" height="142" rx="18" fill="#ffffff" stroke="#c7d2fe"/>
      <circle cx="89" cy="38" r="22" fill="url(#step)"/>
      <text x="89" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">3</text>
      <text x="89" y="84" text-anchor="middle" font-size="19" font-weight="700" fill="#312e81">论文背景</text>
      <text x="89" y="111" text-anchor="middle" font-size="14" fill="#64748b">概念来源与能力边界</text>
    </g>
    <g transform="translate(718 120)">
      <rect width="178" height="142" rx="18" fill="#ffffff" stroke="#c7d2fe"/>
      <circle cx="89" cy="38" r="22" fill="url(#step)"/>
      <text x="89" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">4</text>
      <text x="89" y="84" text-anchor="middle" font-size="19" font-weight="700" fill="#312e81">Pi 工程实现</text>
      <text x="89" y="111" text-anchor="middle" font-size="14" fill="#64748b">包边界、类型与状态</text>
    </g>
    <g transform="translate(938 120)">
      <rect width="204" height="142" rx="18" fill="url(#step)"/>
      <circle cx="102" cy="38" r="22" fill="#ffffff" fill-opacity="0.19"/>
      <text x="102" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">5</text>
      <text x="102" y="84" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">源码运行追踪</text>
      <text x="102" y="111" text-anchor="middle" font-size="14" fill="#e0e7ff">输入 → 事件 → 状态 → 输出</text>
    </g>
  </g>
  <text x="600" y="315" text-anchor="middle" font-family="Inter, 'Noto Sans SC', sans-serif" font-size="14" fill="#64748b">主线始终是 Pi；API 与论文用于解释设计背景，而不是堆砌名词。</text>
</svg>
