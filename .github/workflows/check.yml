name: Course check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      # 源码摘录在构建时从固定版本的 Pi 读取
      - run: git clone --quiet https://github.com/earendil-works/pi.git ../pi-v1.5.0 && git -C ../pi-v1.5.0 checkout --quiet f9a26365568127461c47a07a37dcb42c140a3ac5
      - run: npm ci --ignore-scripts
      # 运行全部实验（实验里的断言失败会让构建失败），检查摘录、链接和面试题
      - run: npm run check
